repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
      - id: clang-format
        name: clang-format (C++)
        files: ^src/.*\.(?:cpp|h|inc)$
        types: [file]
  - repo: local
    hooks:
      - id: policy-files
        name: repository policy (files)
        entry: bash scripts/policy-check.sh files
        language: system
        stages: [pre-commit]
      - id: policy-commit-msg
        name: repository policy (commit message)
        entry: bash scripts/policy-check.sh msg
        language: system
        stages: [commit-msg]
